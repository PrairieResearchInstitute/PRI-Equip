# Sources of truth for PaCELab Equip.
# Format: pri-data-sources (PRI AI project template; the skill sits in
# apps/pri-district-tracker/.claude/skills/pri-data-sources). ODSC collects
# these files to inventory PRI data. Name credentials by their environment
# variable, never by their value. Keep this file current with every change.

app: pacelab-equip
display_name: PaCELab Equip
owner_netid: dreslik
# University of Illinois Data Classification (Information Security Standard
# DAT01.1.1): Public, Internal, Sensitive, High Risk. The app takes the highest
# class of any data it holds (core-lib D-020).
classification: Internal
classification_basis: >
  Internal operational records: instrument bookings, use records and charges
  against university CFOPA grant accounts, laboratory contact names with
  university email addresses, operator names and NetID role grants (schema in
  migrations/0001 to 0003). Staff names and university addresses are directory
  information, and a CFOPA account is an internal accounting code, not banking
  data, so nothing reaches Sensitive under core-lib D-020.
radiant:
  hosting: "Docker containers pacelab-equip-test and pacelab-equip-live"
  databases: [pacelab_live, pacelab_test]

inputs:
  # Data this project reads but does not own. A copy here is a COPY; the original stays authoritative.
  - name: University sign-in identity (NetID and campus groups)
    location: X-Forwarded-Email and X-Forwarded-Groups headers set by the university's authenticating proxy on Radiant (app D-015)
    owner: University of Illinois (campus identity and groups)
    access: proxy headers, no credential held by the app; PACELAB_TRUSTED_PROXIES limits which callers it trusts
    changes: on every request
    mode: read live; the app stores no copy beyond the NetIDs named in role_grants and in its own records

  - name: Illinois Web Toolkit and campus fonts
    location: cdn.toolkit.illinois.edu (toolkit.css, toolkit.js), use.typekit.net
    owner: University of Illinois (Web Toolkit and brand)
    access: public, no credential
    changes: when the toolkit is versioned
    mode: read live by the browser on every page

owned:
  # Data created here that exists nowhere else. These MUST be backed up.
  - name: PaCELab Equip database (laboratories, instruments, rates, grants, reservations, usage records, export batches, email log, role grants)
    engine: PostgreSQL 17
    location: >
      On Radiant: databases pacelab_live and pacelab_test, schema public, the
      tables from migrations 0001 to 0003. Until the move: database pacelab on the
      estate cluster on the drive (app D-012), loaded from lab.sqlite with a
      verified row count; lab.sqlite in data/pacelab-equip/data stays frozen as the
      pre-PostgreSQL copy.
    contains_personal_data: yes
    personal_data: >
      staff names and university email addresses (laboratory contacts, operators,
      principal investigators, administrators), NetIDs in role_grants, the exact
      words of composed email messages, and, for the password mode only, admin
      usernames with password hashes and sign-in attempts with IP addresses
    classification: Internal
    backup: >
      radiant-backup.sh nightly at 02:30: pg_dump -Fc of pacelab_live and
      pacelab_test to Taiga, SHA-256 sidecar, restore into a scratch database with a
      row-count compare. On the drive until the move: platform/scripts/pg-nightly-backup.js,
      plus the app's own BACK UP NOW.bat (tools/backup.ps1 hands over to
      tools/pg-backup.php, pg_dump -Fc with a restore drill).
    retention: >
      ladder of 7 daily, 4 weekly (Sunday) and 6 monthly verified dumps. Rows are
      never deleted: charges void with a reason, instruments retire, revoked grants
      keep revoked_at (AGENTS.md).
    source: typed by administrators and laboratory members through the application's screens

  - name: Studio backups and history log
    engine: files
    location: >
      data/studio-backups and data/studio-history.log inside each container
      (resolved from LAB_DB_PATH by includes/studio.php). compose.yaml mounts no
      volume for them, so a new container starts without them.
    contains_personal_data: yes
    personal_data: the NetID or name of whoever saved, with the time and byte change of each save
    classification: Internal
    backup: >
      radiant-backup.sh folder backup (being added).
    retention: none yet; the copies last only as long as the container
    source: generated by admin/studio.php on every save and refusal

outputs:
  # Files or records this project produces, reproducible from inputs, owned data and code.
  - name: Monthly charge file for the business office
    location: equipment-charges_<start>_to_<end>.csv, downloaded by the browser
    produced_by: report.php (the export batch is recorded in export_batches)

  - name: Composed email messages
    location: the user's Outlook, through a mailto link; the exact words stay in email_log
    produced_by: the email screens (the application never sends mail)

  - name: Release package
    location: dist/ (git-ignored)
    produced_by: tools/build-release.ps1
